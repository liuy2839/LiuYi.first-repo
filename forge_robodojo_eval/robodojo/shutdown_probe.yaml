nodes:
  - id: sender
    path: /data0/liuyi/miniconda3/envs/RoboDojo/bin/python
    args: -u /data0/liuyi/forge_robodojo_eval/robodojo/shutdown_probe.py send
    env:
      PYTHONPATH: /data0/liuyi/forge_robodojo_eval/robodojo
    outputs:
      - policy_command

  - id: policy_probe
    path: /data0/liuyi/miniconda3/envs/RoboDojo/bin/python
    args: -u /data0/liuyi/forge_robodojo_eval/robodojo/shutdown_probe.py policy
    env:
      PYTHONPATH: /data0/liuyi/forge_robodojo_eval/robodojo
    inputs:
      policy_command: sender/policy_command
    outputs:
      - action
