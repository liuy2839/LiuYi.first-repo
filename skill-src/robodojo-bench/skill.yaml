manifest_version: 2
name: robodojo-bench
version: "0.1.0"
description: RoboDojo manipulation-policy benchmark (Isaac Sim, ARX X5) driven through the Forge Tool API.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19021
required_tools:
  - benchmark.describe
  - benchmark.run
profiles:
  g05:
    # Isaac Sim 冷启动要几分钟；PAOS 默认 30s 健康超时会中途杀节点。
    startup_timeout_s: 900
    dataflow: profiles/g05/dataflow.yaml
    required_binaries:
      - gateway
      - bench_tool_node
      - bench_data_node
      - policy_node
    required_assets:
      - profiles/g05/gateway.yaml
      - profiles/g05/bench_config.yaml
    required_environment: []
    # Dora 按 profile 的 environment 渲染节点环境变量；shell export 不会透传。
    # 路径是 zy 服务器的绝对路径（/data0/liuyi/...），换机部署要改这里。
    environment:
      # ---- 数据面（Isaac Sim, RoboDojo conda env）----
      BENCH_DATA_PYTHON: /data0/liuyi/miniconda3/envs/RoboDojo/bin/python
      BENCH_DATA_SRC: /data0/liuyi/forge_robodojo_eval/robodojo
      # ---- 工具面（bench_tool venv, py3.12）----
      BENCH_TOOL_PYTHON: /data0/liuyi/forge_robodojo_eval/bench_tool_venv/bin/python
      BENCH_TOOL_SRC: /data0/liuyi/forge_robodojo_eval/robodojo
      # ---- policy（G05, g05_eval env）----
      BENCH_POLICY_PYTHON: /data0/liuyi/g05_eval/bin/python
  rekep:
    # ReKep 策略 profile：数据面 scene_objects 感知 + ee 动作空间，IK 由策略侧解算。
    startup_timeout_s: 900
    dataflow: profiles/rekep/dataflow.yaml
    required_binaries:
      - gateway
      - bench_tool_node
      - bench_data_node
      - rekep_policy_node
    required_assets:
      - profiles/rekep/gateway.yaml
      - profiles/rekep/bench_config.yaml
    required_environment: []
    environment:
      # ---- 数据面（Isaac Sim, RoboDojo conda env）----
      BENCH_DATA_PYTHON: /data0/liuyi/miniconda3/envs/RoboDojo/bin/python
      BENCH_DATA_SRC: /data0/liuyi/forge_robodojo_eval/robodojo
      # ---- 工具面（bench_tool venv, py3.12）----
      BENCH_TOOL_PYTHON: /data0/liuyi/forge_robodojo_eval/bench_tool_venv/bin/python
      BENCH_TOOL_SRC: /data0/liuyi/forge_robodojo_eval/robodojo
      # ---- policy（ReKep, rekep_policy_dev 策略 venv）----
      BENCH_REKEP_PYTHON: /data0/liuyi/rekep_policy_dev/.venv-policy/bin/python
      BENCH_REKEP_SRC: /data0/liuyi/rekep_policy_dev/nodes/policies/rekep
artifacts:
  resolver: local
  nodes:
    gateway:
      artifact_id: gateway-1.1.1-linux-x86_64
      version: "1.1.1"
      platform: linux
      arch: x86_64
      artifact_type: executable_tar_gz
      entrypoint: gateway
      # 占位：build_skill.sh 会用真实制品的 sha256 重写
      sha256: 3a5666faa9351877756167142fd0ad55c142895c4e5c6b47c6c93325660dd8ff
