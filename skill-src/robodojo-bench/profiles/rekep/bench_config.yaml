# robodojo-bench / profile rekep 的评测配置（数据面加载，serve 模式）。
#
# 与 g05 的差异：
#   - action_type: ee —— ReKep 输出末端位姿，IK 由 Isaac/cuRobo 解算
#   - policy_id: rekep
#   - publish_scene_objects: true —— ReKep 的 scene_objects 感知需要物体真值位姿
benchmark: robodojo
suite: put_bottles_into_dustbin
env_cfg_type: arx_x5
# 沿用 g05 现役显卡（CUDA_VISIBLE_DEVICES 0-6 下的物理 GPU4）
device_id: 4
action_type: ee
policy_id: rekep

serve: true
init_states_per_task: 2
num_runs: 1
max_steps: 300           # 实际按各 task 的 step_lim 自动修正（见 adapter）
max_total_episodes: 60
seed: 0

send_instruction: true
publish_scene_objects: true
publish_camera_info: false

result_dir: /data0/liuyi/forge_robodojo_eval/results_rekep_paos
record_dir: /data0/liuyi/forge_robodojo_eval/records_rekep_paos
camera_map:
  image/head: cam_head
  image/left_wrist: cam_left_wrist
  image/right_wrist: cam_right_wrist