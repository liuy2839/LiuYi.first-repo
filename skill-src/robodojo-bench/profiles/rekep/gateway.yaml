host: 127.0.0.1
port: 19021
joint_order: []
image_input_ids: []
readiness: {require_proprio_state: false, require_images: false}
tools:
  enabled: true
  # 数据面 episode reset 会阻塞数十秒；租约放大到 120s（ttl/3 处续租，tick 1s 足够）
  lease_ttl_ms: 120000
  # run 是 session：无 deadline（批次时长不设上限），这里只管 describe/超时兜底
  invoke_timeout_ms: 7200000
  request_input_id: tool_request
  response_output_id: tool_response
  specs:
    - tool_id: benchmark.describe
      implementation_id: benchmark.controller
      endpoint_id: benchmark.controller
      operation: describe
      semantics: query
      description: >
        Read the RoboDojo benchmark capability snapshot (suite, tasks with
        per-task init-state counts, joint names, camera ids, defaults and
        episode-count limits). Call this before constructing a run.
      input_schema:
        type: object
        additionalProperties: false
        properties: {}
      output_schema: {type: object}
      readiness: []
      robot_frame_profile: null
    - tool_id: benchmark.run
      implementation_id: benchmark.controller
      endpoint_id: benchmark.controller
      operation: run
      semantics: session
      description: >
        Run a benchmark batch (episodes = task_ids x init_state_ids x num_runs)
        against the active policy profile. Returns a session; poll status/result
        until terminal. stop lands at the next episode boundary.
      input_schema:
        type: object
        additionalProperties: false
        properties:
          task_ids:
            anyOf:
              - {type: "null"}
              - {type: array, minItems: 1, items: {type: integer, minimum: 0}}
          init_state_ids:
            anyOf:
              - {type: "null"}
              - {type: array, minItems: 1, items: {type: integer, minimum: 0}}
          num_runs: {type: integer, minimum: 1}
          max_steps: {type: integer, minimum: 1}
          seed: {type: integer}
      output_schema:
        type: object
        required: [run_id, status, completed_episodes, total_episodes, success_rate, result_file, failure_summary]
        properties:
          run_id: {type: string}
          status: {enum: [succeeded, failed, partial, stopped]}
          completed_episodes: {type: integer}
          total_episodes: {type: integer}
          success_rate: {type: number}
          result_file: {type: [string, "null"]}
          failure_summary: {type: [string, "null"]}
      readiness: []
      robot_frame_profile: null
  providers:
    - {endpoint_id: benchmark.controller, input_id: bench_tool_in, output_id: bench_tool_out}
