# robodojo-bench / profile g05 的 dataflow：四节点。
#
# 节点用"薄壳启动器"（PyInstaller onefile，exec 对应环境的 python）：
# Isaac Sim 无法 PyInstaller 打包，但它只需要一个 exec 入口——rekep-skill
# 已验证此法在 PAOS Skill Runtime 下工作。
#
# 拓扑（控制面 + 数据面）：
#   gateway ──bench_tool_in/out──► bench_tool（py3.12，Forge Tool 工具面）
#   bench_tool ──bench_command──► bench_data（py3.10，Isaac Sim 数据面）
#   bench_tool ◄──benchmark_status / benchmark_result / benchmark_capabilities── bench_data
#   bench_data ──proprio_state / image/* / policy_command──► policy（G05）
#   policy ──action──► bench_data
nodes:
  - id: gateway
    path: ${FORGE_RUNTIME_BIN}/gateway
    args: --config gateway.yaml
    inputs:
      tick: dora/timer/millis/50
      bench_tool_in: bench_tool/tool_out
    outputs:
      - tool_response
      - bench_tool_out

  - id: bench_tool
    path: ${FORGE_RUNTIME_BIN}/bench_tool_node
    env:
      BENCH_TOOL_SRC: /data0/liuyi/forge_robodojo_eval/robodojo
    inputs:
      tick: dora/timer/millis/1000
      tool_in: gateway/bench_tool_out
      benchmark_status: bench_data/benchmark_status
      benchmark_result: bench_data/benchmark_result
      benchmark_capabilities: bench_data/benchmark_capabilities
    outputs:
      - tool_out
      - bench_command

  - id: bench_data
    path: ${FORGE_RUNTIME_BIN}/bench_data_node
    env:
      BENCHMARK_CONFIG: bench_config.yaml
      ROBODOJO_ROOT: /data0/liuyi/robodojo/RoboDojo
      PYTHONPATH: /data0/liuyi/robodojo/RoboDojo/XPolicyLab
      # Hide GPU 7, which NVML lists but the CUDA runtime cannot initialize.
      # Keeping 0-6 in order preserves cuda:4 as physical GPU 4.
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6"
      LD_LIBRARY_PATH: /data0/liuyi/miniconda3/envs/RoboDojo/lib
      OMNI_KIT_ACCEPT_EULA: "YES"
    inputs:
      bench_command: bench_tool/bench_command
      action: policy/action
    outputs:
      - proprio_state
      - image/head
      - image/left_wrist
      - image/right_wrist
      - policy_command
      - benchmark_status
      - benchmark_result
      - benchmark_capabilities

  - id: policy
    path: ${FORGE_RUNTIME_BIN}/policy_node
    env:
      XPOLICYLAB_ROOT: /data0/liuyi/robodojo/RoboDojo/XPolicyLab
      POLICY_NAME: G05
      ENV_CFG_TYPE: arx_x5
      ACTION_TYPE: joint
      CUDA_VISIBLE_DEVICES: "6"
      G05_ROOT: /data0/liuyi/robodojo/RoboDojo/XPolicyLab/policy/G05/G05
      G05_CKPT_PATH: /data0/liuyi/g05_models/sim/hf_g05_robodojo_fm_only_checkpoint/checkpoints/checkpoint
      G05_PROCESSOR_PATH: /data0/liuyi/g05_models/base_assets/g05_robodojo_train_base_assets/pretrained/hf_processor
      G05_HF_PROCESSOR_PATH: /data0/liuyi/g05_models/base_assets/g05_robodojo_train_base_assets/pretrained/hf_processor
      G05_ACTION_TOKENIZER_PATH: /data0/liuyi/g05_models/sim/hf_g05_robodojo_fm_only_checkpoint/action_tokenizer.pt
      ROBODOJO_G05_ACTION_SOURCE: fm
      # Required by the saved training config resolver; inference does not read this dataset.
      ROBODOJO_LEROBOT_V30_ROOT: /data0/liuyi/g05_models/sim/hf_g05_robodojo_fm_only_checkpoint
      PYTHONPATH: /data0/liuyi/robodojo/RoboDojo/XPolicyLab/policy/G05/G05/src:/data0/liuyi/robodojo/RoboDojo/XPolicyLab/policy/G05/G05
    inputs:
      tick: dora/timer/millis/20      # 只当心跳，绝不在 tick 上推理
      policy_command:
        source: bench_data/policy_command
        # 必须显式加深：episode 边界会在这条通道上连发 set_instruction +
        # reset_scene 两条 PolicyCommand，默认队列深度会挤掉前一条
        queue_size: 32
      proprio_state: bench_data/proprio_state
      image/head: bench_data/image/head
      image/left_wrist: bench_data/image/left_wrist
      image/right_wrist: bench_data/image/right_wrist
    outputs:
      - action
