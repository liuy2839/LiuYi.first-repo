# robodojo-bench / profile g05 的评测配置（数据面加载，serve 模式）。
#
# 与 zy 上裸 dora 跑法的 config.yaml 唯一区别：serve: true。
# task_ids/init_state_ids/num_runs/max_steps 不在这里定死——serve 模式下由
# benchmark.run 的参数决定；这里只给默认值和护栏。
benchmark: robodojo
suite: put_bottles_into_dustbin
env_cfg_type: arx_x5
# 与 zy 现役裸 dora 跑法一致：device 4 = CUDA_VISIBLE_DEVICES 0-6 下的物理 GPU4
device_id: 4
action_type: joint
policy_id: G05

serve: true
# 单次 run 的护栏（0 = 不限）。默认 task 全集 × init_states_per_task
init_states_per_task: 2
num_runs: 1
max_steps: 300           # 实际按各 task 的 step_lim 自动修正（见 adapter）
max_total_episodes: 60   # 防止 Agent 一口气开满跑几小时
seed: 0

send_instruction: true
publish_scene_objects: false
publish_camera_info: false

result_dir: /data0/liuyi/forge_robodojo_eval/results_paos
record_dir: /data0/liuyi/forge_robodojo_eval/records_paos
camera_map:
  image/head: cam_head
  image/left_wrist: cam_left_wrist
  image/right_wrist: cam_right_wrist
